<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Left ear -->
  <ellipse cx="8" cy="10" rx="4" ry="5.5" fill="#1a1a1a" transform="rotate(-15 8 10)"/>
  <!-- Right ear -->
  <ellipse cx="24" cy="10" rx="4" ry="5.5" fill="#1a1a1a" transform="rotate(15 24 10)"/>

  <!-- Head -->
  <ellipse cx="16" cy="16" rx="11" ry="10" fill="#1a1a1a"/>

  <!-- Muzzle -->
  <ellipse cx="16" cy="21" rx="6.5" ry="4.5" fill="#92400E"/>

  <!-- Tan eyebrow dots -->
  <circle cx="12" cy="12" r="2" fill="#B45309"/>
  <circle cx="20" cy="12" r="2" fill="#B45309"/>

  <!-- Eyes -->
  <circle cx="12" cy="17" r="2.5" fill="#fff"/>
  <circle cx="20" cy="17" r="2.5" fill="#fff"/>
  <!-- Pupils -->
  <circle cx="12.5" cy="17.5" r="1.5" fill="#1a1a1a"/>
  <circle cx="20.5" cy="17.5" r="1.5" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="13" cy="16.5" r="0.5" fill="#fff"/>
  <circle cx="21" cy="16.5" r="0.5" fill="#fff"/>

  <!-- Nose -->
  <ellipse cx="16" cy="20" rx="2" ry="1.5" fill="#0a0a0a"/>
</svg>
