pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      glob: "*.{js,mjs,ts,tsx,json}"
      exclude:
        - "docs/**/*"
        - "examples/**/*"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "*.{js,mjs,ts,tsx}"
      exclude:
        - "docs/**/*"
        - "examples/**/*"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    format-recheck:
      # eslint --fix (e.g. curly's brace insertion) can re-break formatting
      # Prettier already applied, so run Prettier again to have the final word.
      priority: 3
      glob: "*.{js,mjs,ts,tsx,json}"
      exclude:
        - "docs/**/*"
        - "examples/**/*"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    types:
      priority: 4
      glob: "*.{js,ts,tsx}"
      exclude:
        - "docs/**/*"
        - "examples/**/*"
      run: npx tsc
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
