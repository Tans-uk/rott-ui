pre-commit:
  parallel: false
  commands:
    lint:
      priority: 1
      glob: "*.{js,mjs,ts,tsx}"
      exclude:
        - "docs/**/*"
        - "examples/**/*"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    format:
      priority: 2
      glob: "*.{js,mjs,ts,tsx,json}"
      exclude:
        - "docs/**/*"
        - "examples/**/*"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    types:
      priority: 3
      glob: "*.{js,ts,tsx}"
      exclude:
        - "docs/**/*"
        - "examples/**/*"
      run: npx tsc
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
